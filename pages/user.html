<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta · Mayco Company</title>
  <meta name="description" content="Inicia sesión o crea tu cuenta en Mayco Company.">
  <link rel="icon" href="../assets/img/logo-co.webp" type="image/webp">
  <!-- Tipografías: Kumbh Sans y Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Kumbh+Sans:wght@400;500;700&amp;display=swap">
  <!-- Estilos del proyecto -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <!-- main.js se carga sin defer para añadir la clase .js antes de pintar la página -->
  <script src="../js/main.js"></script>
  <script src="../js/auth.js" defer></script>
</head>
<body class="page page--user">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <main id="contenido" class="auth">
    <h1 class="visually-hidden">Mi cuenta en Mayco Company</h1>

    <!-- Decoración: formas cromadas del diseño original -->
    <img class="auth__shape auth__shape--1" src="../assets/img/login-cromo-1.webp" alt="" width="615" height="630">
    <img class="auth__shape auth__shape--2" src="../assets/img/login-cromo-2.webp" alt="" width="575" height="399">

    <a class="auth__logo" href="../index.html">
      <img src="../assets/img/logo-mayco-company.webp" alt="Mayco Company, volver al inicio" width="180" height="64">
    </a>

    <p class="auth__welcome">¡Bienvenido!</p>

    <div class="auth__card">
      <!-- IA: Revisado · Iniciar sesión -->
      <section class="auth-form is-active" id="login" aria-labelledby="login-titulo">
        <h2 class="auth-form__title" id="login-titulo" tabindex="-1">Iniciar sesión</h2>
        <form class="form" data-login novalidate>
          <div class="field field--icon">
            <label class="field__label" for="login-usuario">Usuario o correo</label>
            <svg class="icon icon--sm field__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c1.4-4.2 4.6-6.5 8.5-6.5s7.1 2.3 8.5 6.5"/></svg>
            <input class="field__input" id="login-usuario" name="usuario" type="text" autocomplete="username" required aria-describedby="login-usuario-error">
            <p class="field__error" id="login-usuario-error" aria-live="polite"></p>
          </div>
          <div class="field field--icon">
            <label class="field__label" for="login-password">Contraseña</label>
            <svg class="icon icon--sm field__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            <input class="field__input" id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-error">
            <p class="field__error" id="login-password-error" aria-live="polite"></p>
          </div>
          <label class="checkbox"><input type="checkbox" name="recordar"> Recuérdame</label>
          <p class="form__message" aria-live="polite" data-form-mensaje></p>
          <button class="btn btn--primary btn--block" type="submit">Iniciar sesión</button>
        </form>
        <p class="auth-form__switch">¿No tienes cuenta? <a href="#signup" data-auth-cambiar>Crear cuenta</a></p>
      </section>

      <!-- IA: Revisado · Crear cuenta -->
      <section class="auth-form" id="signup" aria-labelledby="signup-titulo">
        <h2 class="auth-form__title" id="signup-titulo" tabindex="-1">Crear cuenta</h2>
        <form class="form" data-signup novalidate>
          <div class="field">
            <label class="field__label" for="signup-nombre">Nombre</label>
            <input class="field__input" id="signup-nombre" name="nombre" type="text" autocomplete="name" required aria-describedby="signup-nombre-error">
            <p class="field__error" id="signup-nombre-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label class="field__label" for="signup-correo">Correo</label>
            <input class="field__input" id="signup-correo" name="correo" type="email" autocomplete="email" required aria-describedby="signup-correo-error">
            <p class="field__error" id="signup-correo-error" aria-live="polite"></p>
          </div>
          <div class="auth-form__pair">
            <div class="field">
              <label class="field__label" for="signup-password">Contraseña</label>
              <input class="field__input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="signup-password-ayuda signup-password-error">
              <p class="field__hint" id="signup-password-ayuda">Mínimo 8 caracteres.</p>
              <p class="field__error" id="signup-password-error" aria-live="polite"></p>
            </div>
            <div class="field">
              <label class="field__label" for="signup-confirmar">Confirmar</label>
              <input class="field__input" id="signup-confirmar" name="confirmar" type="password" autocomplete="new-password" required aria-describedby="signup-confirmar-error">
              <p class="field__error" id="signup-confirmar-error" aria-live="polite"></p>
            </div>
          </div>
          <p class="form__message" aria-live="polite" data-form-mensaje></p>
          <button class="btn btn--primary btn--block" type="submit">Crear cuenta</button>
        </form>
        <p class="auth-form__switch">¿Ya tienes cuenta? <a href="#login" data-auth-cambiar>Iniciar sesión</a></p>
      </section>
    </div>
  </main>
</body>
</html>
